version: "3.9"

services:
  backend:
    build: ./backend
    container_name: bytebites-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    env_file:
      - .env

  frontend:
    build: ./frontend
    container_name: bytebites-frontend
    ports:
      - "3000:80"
    depends_on:
      - backend